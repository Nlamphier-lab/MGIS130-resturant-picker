<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIT Restaurant Picker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <h1>🍕 Can't Decide Where to Eat Around RIT? 🍔</h1>
    <p>Let us help you pick from local Rochester favorites!</p>

    <div class="controls">
      <button onclick="pickRestaurant()">Pick a Restaurant! 🎲</button>
      <label for="budget">Budget:</label>
      <select id="budget">
        <option value="any">Any Budget</option>
        <option value="$">$ (Cheap)</option>
        <option value="$$">$$ (Moderate)</option>
        <option value="$$$">$$$ (Splurge)</option>
      </select>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
